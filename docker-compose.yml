services:
  playlist-bridge:
    image: ${HARMONIA_IMAGE:-ghcr.io/rstuke82/playlist-bridge:beta}
    build:
      context: .
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    mem_limit: ${HARMONIA_MEMORY_LIMIT:-1g}
    cpus: ${HARMONIA_CPU_LIMIT:-2}
    pids_limit: 256
    ports:
      - "${HARMONIA_BIND_ADDRESS:-127.0.0.1}:${HARMONIA_PORT:-8173}:${HARMONIA_PORT:-8173}"
    environment:
      HARMONIA_PORT: ${HARMONIA_PORT:-8173}
      HARMONIA_DATA_DIR: /data
      HARMONIA_HTTPS_ONLY: ${HARMONIA_HTTPS_ONLY:-false}
      HARMONIA_TRUSTED_PROXIES: ${HARMONIA_TRUSTED_PROXIES:-127.0.0.1,::1}
      TZ: ${TZ:-}
      HARMONIA_UPDATE_CHANNEL: ${HARMONIA_UPDATE_CHANNEL:-beta}
    volumes:
      - ./data:/data
    stop_grace_period: 30s
